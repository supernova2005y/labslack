name: Weekly Toban Bot
on:
  # 外部(cron-job.org)からのAPI呼び出し（手動実行）のみを許可する設定に変更
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install slack_sdk
      - name: Run script
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TOBAN_MEMBERS1: ${{ secrets.TOBAN_MEMBERS1 }}
          TOBAN_MEMBERS2: ${{ secrets.TOBAN_MEMBERS2 }}
        run: python toban_bot.py
