name: Weekly Toban Bot
on:
  schedule:
    - cron: '0 0 * * 1' # UTCの0:00 (日本時間の月曜9:00)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install slack_sdk
      - name: Run script
        run: python toban_bot.py